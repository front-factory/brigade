name: CI

on:
  push:
    branches: [ "main", "develop", "beta" ]
  pull_request:
    branches: [ "main", "develop", "beta" ]

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test (Node 24)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Test
        run: npm test

  publish:
    runs-on: ubuntu-latest
    needs: [ test ]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

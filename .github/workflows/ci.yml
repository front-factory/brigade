name: CI

on:
  push:
    branches: [ "main", "develop", "beta" ]
  pull_request:
    branches: [ "main", "develop", "beta" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      # Minimum supported Node (engines) on every OS, plus the latest Node on Linux.
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node-version: [ 24 ]
        include:
          - os: ubuntu-latest
            node-version: node

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      # Lint and commitlint run once, not on every matrix entry.
      - name: Lint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 24 }}
        run: npm run lint

      - name: Commitlint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 24 }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          else
            npx commitlint --last --verbose
          fi

      - name: Test
        run: npm test

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ test ]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-audit
        env:
          HUSKY: 0

      # No npm token: @semantic-release/npm authenticates to the registry through the OIDC id-token.
      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
